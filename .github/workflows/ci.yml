name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Use npm ci after generating and committing package-lock.json in a network-enabled environment.
      - run: npm install
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-sidekick-chrome-mv3
          path: .output/chrome-mv3/
